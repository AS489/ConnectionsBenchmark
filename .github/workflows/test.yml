name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "./runner[dev]"
      - run: pytest runner/tests
      - name: Mock end-to-end (no API key, no network)
        run: |
          DATE=$(ls data/puzzles/*/*.json | sort | tail -1 | xargs -n1 basename | sed 's/.json$//')
          TMP=$(mktemp -d)
          mkdir -p "$TMP/data" && cp -r data/puzzles "$TMP/data/"
          connbench run --date "$DATE" --provider mock --data "$TMP/data"
          connbench index --data "$TMP/data"
          test -s "$TMP/data/index/leaderboard.json"
