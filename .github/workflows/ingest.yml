name: ingest

on:
  schedule:
    - cron: "0 14 * * *"   # 10:00 ET, after NYT publishes (00:00 ET) and the mirror updates
  workflow_dispatch:

permissions:
  contents: write

# Shared with daily.yml/backfill.yml so a manual backfill can never race a data commit.
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./runner
      - name: Ingest new puzzles
        run: connbench ingest
      - name: Fail loudly if the archive has gone stale
        run: connbench check
      - name: Commit archive changes
        run: |
          git config user.name "connbench-bot"
          git config user.email "connbench-bot@users.noreply.github.com"
          git add data/puzzles
          if git diff --cached --quiet; then
            echo "archive already current"
          else
            git commit -m "ingest: $(date -u +%F)"
            git push
          fi
