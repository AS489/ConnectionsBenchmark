# Token budgets are a LATENCY decision, not just a correctness one. Measured
# 2026-09-26 on nvidia/nemotron-3-super-120b-a12b:free at 74 tok/s:
#   the model spent 86% of its output on chain-of-thought, hit the old 4096 cap
#   on every request, truncated mid-thought and forfeited with 9 invalids.
# But raising max_tokens alone is not the fix — time is generation-bound, so
# max_tokens=32000 would mean ~7 min PER TURN, ~50 min per game.
# So: cap `reasoning` to bound thinking, and set max_tokens just above it to
# leave room for the JSON. Tune `reasoning`, not max_tokens.

defaults:
  temperature: 0
  reasoning: { max_tokens: 6000 }   # bounds thinking; ~1.4 min/turn at 74 tok/s
  max_tokens: 8000                  # reasoning + room for the JSON answer
  attempts_per_day: 1
  max_cost_usd_per_run: 0.50
  json_schema: true

models:
  - slug: anthropic__claude-opus-5
    openrouter_id: anthropic/claude-opus-5
    reasoning: { max_tokens: 8000 }
  - slug: anthropic__claude-sonnet-5
    openrouter_id: anthropic/claude-sonnet-5
    reasoning: { max_tokens: 8000 }
  - slug: openai__gpt-5
    openrouter_id: openai/gpt-5
    reasoning: { effort: medium }
  - slug: google__gemini-2.5-pro
    openrouter_id: google/gemini-2.5-pro
    reasoning: { effort: medium }
