# Free-tier roster — every free text model OpenRouter offers that can plausibly
# play the game. Generated 2026-09-26; regenerate with scripts/gen_free_roster.py.
#
# Excluded by design: lyria-* (music generation), nemotron-3.5-content-safety
# (a classifier), and openrouter/free (a ROUTER — it resolves to a different
# model per call, which breaks the snapshot pinning the benchmark depends on).
#
# Token budgets: see the header of models.yaml. Time is generation-bound, so
# `reasoning` is the lever, not max_tokens.

defaults:
  temperature: 0
  reasoning: { max_tokens: 6000 }
  max_tokens: 8000
  attempts_per_day: 1
  max_cost_usd_per_run: 0.01   # free models report 0; a tripwire, not a budget

models:
  - slug: free__north-mini-code
    openrouter_id: cohere/north-mini-code:free
    json_schema: false
  - slug: free__dots-3-note-preview
    openrouter_id: dots-studio/dots-3-note-preview:free
    json_schema: true
